<h2>Catálogo</h2>

<div class="filters">
    <input
        type="text"
        placeholder="Buscar..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)" />
    <button type="button" (click)="toggleAvailable()">
        @if (showOnlyAvailable) { Mostrar todos } @else { Solo disponibles }
    </button>
    <button type="button" (click)="addSample()">+ Agregar demo</button>
</div>

<ul class="grid">
    @for (p of filteredProducts; track p.id) {
    <li class="row" [class]="rowClass(p)">
        <h3>{{ p.name }}</h3>
        <p class="price">{{ p.price | currency:'USD':'symbol':'1.0-0' }}</p>
        <p class="stock">{{ badge(p) }}</p>
    </li>
    } @empty {
    <li>No hay productos.</li>
    }
</ul>
